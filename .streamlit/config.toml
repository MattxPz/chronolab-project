# Tema propio de Chronolab.
#
# No es una eleccion aparte: son los mismos tokens que ya validan las figuras
# de `chronolab.viz.plots` (CATEGORICAL, INK_*, GRIDLINE, SURFACE) y las
# figuras estaticas de `scripts/run_anomaly_eval.py`. Una sola paleta para
# Plotly y para el chrome de Streamlit es lo que evita que la app "se note"
# como dos aplicaciones distintas pegadas con cinta.
#
# Fuente del sistema, no un webfont remoto: la app tiene que arrancar sin red
# (docs/ARCHITECTURE.md, modo demo), y un `@import` de Google Fonts lo
# rompería en el primer render.

[theme]
base = "light"

primaryColor = "#2a78d6"              # CATEGORICAL[0] — acento, enlaces, foco
backgroundColor = "#fcfcfb"           # SURFACE
secondaryBackgroundColor = "#f2f1ec"  # entre SURFACE y GRIDLINE — sidebar y tarjetas
textColor = "#0b0b0b"                 # INK_PRIMARY

borderColor = "#e1e0d9"               # GRIDLINE
dataframeBorderColor = "#e1e0d9"
linkColor = "#2a78d6"
codeBackgroundColor = "#f2f1ec"

showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.5rem"
buttonRadius = "0.4rem"

font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 15
headingFontWeights = [700, 650, 600, 600, 600, 600]

# Aplican a Plotly/Altair/Vega-Lite solo si una figura pide expresamente el
# tema de Streamlit (`theme="streamlit"`); las figuras de `viz.plots` traen
# su propio layout (`_base_layout`) y no lo piden, asi que esto es coherencia
# para cualquier grafico nativo futuro, no una redefinicion de las actuales.
chartCategoricalColors = [
    "#2a78d6", "#eb6834", "#1baf7a", "#eda100",
    "#e87ba4", "#008300", "#4a3aa7", "#e34948",
]

[theme.sidebar]
backgroundColor = "#f2f1ec"
secondaryBackgroundColor = "#e9e8e2"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"

[client]
showSidebarNavigation = true
toolbarMode = "minimal"

[server]
enableStaticServing = false
