name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "0"

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      # Core + dev + api: `chronolab.api.service` importa fastapi a nivel de
      # modulo, asi que mypy (que sigue imports de verdad, no solo los
      # declarados) y `test_module_tree.py` necesitan tenerlo instalado. Los
      # extras ml/deep no entran aqui -mantienen el job por debajo del minuto
      # de instalacion- y se ejercitan en el job `smoke`.
      - name: Install core + dev + api
        run: uv sync --extra api

      - name: Lint (ruff check)
        run: uv run ruff check --output-format=github .

      - name: Format (ruff format --check)
        run: uv run ruff format --check .

      - name: Typecheck (mypy --strict sobre src/)
        run: uv run mypy

      # `-m "not slow and not network"` es el mismo filtro que `make test-fast`:
      # sin los extras ml/deep instalados aqui, los adaptadores pesados ya se
      # saltan solos via `pytest.importorskip`, pero filtrar por marca ademas
      # evita que este job empiece a arrastrar los tests `slow` en cuanto la
      # imagen tenga esos extras instalados por otro motivo.
      - name: Test
        run: >
          uv run pytest -m "not slow and not network"
          --cov --cov-report=term-missing --cov-report=html

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 14

  artifact-size:
    name: tamaño de reports/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Guardarrail de docs/ARCHITECTURE.md §7.6: los artefactos demo van
      # versionados, y sin tope el repo engorda hasta romper el despliegue.
      - name: reports/ debe pesar menos de 50 MB
        run: |
          size_kb=$(du -sk reports | cut -f1)
          echo "reports/ = ${size_kb} KB"
          if [ "$size_kb" -gt 51200 ]; then
            echo "::error::reports/ supera los 50 MB (${size_kb} KB)"
            exit 1
          fi
